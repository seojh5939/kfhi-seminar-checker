name: Release (Main Merge & Exe Deploy)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  check-and-release:
    name: Check Version & Release Windows Executables
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Package Version vs Latest GitHub Release
        id: version_check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const currentVersion = pkg.version;

            let latestVersion = '0.0.0';
            let latestTagName = 'none';
            let latestReleaseAssetsCount = 0;

            try {
              const { data: release } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              latestTagName = release.tag_name;
              latestVersion = release.tag_name.replace(/^v/, '');
              latestReleaseAssetsCount = (release.assets && Array.isArray(release.assets)) ? release.assets.length : 0;
            } catch (error) {
              if (error.status === 404) {
                core.info('No previous releases found on GitHub. This will be the first release.');
              } else {
                throw error;
              }
            }

            function compareSemver(v1, v2) {
              const p1 = v1.split('.').map(n => parseInt(n, 10) || 0);
              const p2 = v2.split('.').map(n => parseInt(n, 10) || 0);
              for (let i = 0; i < Math.max(p1.length, p2.length); i++) {
                const n1 = p1[i] || 0;
                const n2 = p2[i] || 0;
                if (n1 > n2) return 1;
                if (n1 < n2) return -1;
              }
              return 0;
            }

            const semverComparison = compareSemver(currentVersion, latestVersion);
            const isNewer = semverComparison > 0;
            // 만약 태그는 생성되었으나 4개 exe 바이너리가 완전히 업로드되지 않은 경우 재업로드 허용
            const isIncompleteRelease = (semverComparison === 0 && latestReleaseAssetsCount < 4);

            const isMainPush = (context.eventName === 'push' && context.ref === 'refs/heads/main');
            const isDispatch = (context.eventName === 'workflow_dispatch');
            const shouldRelease = (isMainPush && (isNewer || isIncompleteRelease)) || isDispatch;

            core.info(`--------------------------------------------------`);
            core.info(`📌 Current package.json Version : ${currentVersion}`);
            core.info(`🏷️ Latest GitHub Release Version : ${latestVersion} (${latestTagName})`);
            core.info(`📦 Assets count in latest release: ${latestReleaseAssetsCount}`);
            core.info(`✨ Is Current Version Newer?     : ${isNewer}`);
            core.info(`🔄 Is Release Incomplete?        : ${isIncompleteRelease}`);
            core.info(`🚀 Should Trigger Release?       : ${shouldRelease}`);
            core.info(`--------------------------------------------------`);

            if (context.eventName === 'pull_request') {
              if (isNewer) {
                core.notice(`[PR Check] Version ${currentVersion} is newer than latest release (${latestVersion}). Merging this PR will automatically publish a new Release!`);
              } else {
                core.warning(`[PR Check] Current version (${currentVersion}) is NOT greater than latest release (${latestVersion}). If this PR is meant for a new release, bump the version in package.json.`);
              }
            }

            core.setOutput('current_version', currentVersion);
            core.setOutput('latest_version', latestVersion);
            core.setOutput('tag_name', `v${currentVersion}`);
            core.setOutput('is_newer', isNewer ? 'true' : 'false');
            core.setOutput('should_release', shouldRelease ? 'true' : 'false');

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: |
          pnpm build:shared
          pnpm test

      - name: Verify Build
        run: pnpm build:all

      # 구글 인증 정보 Secret이 설정되어 있는 경우 주입
      - name: Setup Google Credentials (Optional Secret)
        if: env.GOOGLE_CREDENTIALS_SECRET != ''
        env:
          GOOGLE_CREDENTIALS_SECRET: ${{ secrets.GOOGLE_CREDENTIALS }}
        shell: bash
        run: |
          echo "$GOOGLE_CREDENTIALS_SECRET" > google-credentials.json

      # 버전이 최신이거나 미완료된 릴리즈인 경우 exe 패키징 실행
      - name: Package Windows Executables
        if: steps.version_check.outputs.should_release == 'true'
        run: pnpm package:win:all

      # GitHub CLI를 통한 안정적인 Release 생성 및 순차적 대용량 exe 파일 업로드
      - name: Create GitHub Release & Upload Binaries
        if: steps.version_check.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version_check.outputs.tag_name }}
        run: |
          Write-Host "Creating or verifying GitHub Release for $env:TAG_NAME..."
          
          # Release 생성 시도 (이미 존재하는 경우 오류 무시하고 업로드로 진행)
          $createResult = gh release create $env:TAG_NAME --title "Release $env:TAG_NAME" --generate-notes --draft=false --prerelease=false 2>&1
          Write-Host "Release create response: $createResult"

          # EXE 파일 목록 확인
          $files = Get-ChildItem -Path "generator/release/*.exe", "reader/release/*.exe" -File
          Write-Host "Found $($files.Count) binary files to upload:"
          $files | ForEach-Object { Write-Host " - $($_.FullName)" }

          if ($files.Count -eq 0) {
            Write-Error "No .exe files found to upload in generator/release or reader/release!"
            exit 1
          }

          # 대용량 바이너리를 순차적으로 안정 업로드 (--clobber 로 덮어쓰기 허용)
          foreach ($file in $files) {
            Write-Host "Uploading $($file.Name)..."
            gh release upload $env:TAG_NAME "$($file.FullName)" --clobber
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to upload $($file.Name)"
              exit 1
            }
            Write-Host "Successfully uploaded $($file.Name)"
          }

