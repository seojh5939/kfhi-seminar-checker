name: Release (Main Merge & Exe Deploy)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  check-and-release:
    name: Check Version & Release Windows Executables
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Package Version vs Latest GitHub Release
        id: version_check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const currentVersion = pkg.version;

            let latestVersion = '0.0.0';
            let latestTagName = 'none';
            let latestReleaseAssetsCount = 0;

            try {
              const { data: release } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              latestTagName = release.tag_name;
              latestVersion = release.tag_name.replace(/^v/, '');
              latestReleaseAssetsCount = (release.assets && Array.isArray(release.assets)) ? release.assets.length : 0;
            } catch (error) {
              if (error.status === 404) {
                core.info('No previous releases found on GitHub. This will be the first release.');
              } else {
                throw error;
              }
            }

            function compareSemver(v1, v2) {
              const p1 = v1.split('.').map(n => parseInt(n, 10) || 0);
              const p2 = v2.split('.').map(n => parseInt(n, 10) || 0);
              for (let i = 0; i < Math.max(p1.length, p2.length); i++) {
                const n1 = p1[i] || 0;
                const n2 = p2[i] || 0;
                if (n1 > n2) return 1;
                if (n1 < n2) return -1;
              }
              return 0;
            }

            const semverComparison = compareSemver(currentVersion, latestVersion);
            const isNewer = semverComparison > 0;
            const isMainPush = (context.eventName === 'push' && context.ref === 'refs/heads/main');
            const isDispatch = (context.eventName === 'workflow_dispatch');
            // main 브랜치 푸시 시 최신 버전이거나 동일 버전이면 항상 패키징 및 릴리즈 덮어쓰기 실행
            const shouldRelease = (isMainPush && semverComparison >= 0) || isDispatch;

            core.info(`--------------------------------------------------`);
            core.info(`📌 Current package.json Version : ${currentVersion}`);
            core.info(`🏷️ Latest GitHub Release Version : ${latestVersion} (${latestTagName})`);
            core.info(`📦 Assets count in latest release: ${latestReleaseAssetsCount}`);
            core.info(`✨ Is Current Version Newer?     : ${isNewer}`);
            core.info(`🚀 Should Trigger Release?       : ${shouldRelease}`);
            core.info(`--------------------------------------------------`);

            if (context.eventName === 'pull_request') {
              if (isNewer) {
                core.notice(`[PR Check] Version ${currentVersion} is newer than latest release (${latestVersion}). Merging this PR will automatically publish a new Release!`);
              } else {
                core.warning(`[PR Check] Current version (${currentVersion}) is NOT greater than latest release (${latestVersion}). If this PR is meant for a new release, bump the version in package.json.`);
              }
            }

            core.setOutput('current_version', currentVersion);
            core.setOutput('latest_version', latestVersion);
            core.setOutput('tag_name', `v${currentVersion}`);
            core.setOutput('is_newer', isNewer ? 'true' : 'false');
            core.setOutput('should_release', shouldRelease ? 'true' : 'false');

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # [1단계] 구글 인증 정보 Secret 주입 및 JSON 유효성 가시화 검증
      - name: Setup & Validate Google Credentials
        shell: pwsh
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          Write-Host "=========================================================="
          Write-Host "🔍 [STEP 1] Validating and Writing Google Credentials..."
          Write-Host "=========================================================="
          
          if (-not $env:GOOGLE_CREDS -or $env:GOOGLE_CREDS.Trim() -eq '') {
            Write-Error "❌ CRITICAL: GOOGLE_CREDENTIALS secret is empty or missing in GitHub Repository Secrets!"
            exit 1
          }

          # JSON 파싱 검증
          try {
            $json = $env:GOOGLE_CREDS | ConvertFrom-Json
          } catch {
            Write-Error "❌ CRITICAL: GOOGLE_CREDENTIALS secret is not valid JSON! Error: $_"
            exit 1
          }

          # installed / web / client_id 구조 확인
          $clientId = ""
          $projectId = "N/A"
          $hasSecret = $false

          if ($json.installed) {
            $clientId = $json.installed.client_id
            $projectId = $json.installed.project_id
            $hasSecret = [bool]$json.installed.client_secret
          } elseif ($json.web) {
            $clientId = $json.web.client_id
            $projectId = $json.web.project_id
            $hasSecret = [bool]$json.web.client_secret
          } elseif ($json.client_id) {
            $clientId = $json.client_id
            $projectId = $json.project_id
            $hasSecret = [bool]$json.client_secret
          }

          if (-not $clientId) {
            Write-Error "❌ CRITICAL: No client_id found in google-credentials.json structure!"
            exit 1
          }

          # 안전한 마스킹 출력 (앞 12글자 + ... + 뒷 10글자)
          $maskedClientId = if ($clientId.Length -gt 25) {
            $clientId.Substring(0, 12) + "..." + $clientId.Substring($clientId.Length - 10)
          } else {
            "***"
          }

          Write-Host "🔑 [Credentials Validation Info]"
          Write-Host "  - Project ID    : $projectId"
          Write-Host "  - Client ID     : $maskedClientId"
          Write-Host "  - Client Secret : $(if ($hasSecret) { '✅ Present' } else { '❌ Missing' })"

          # 파일 생성 (루트 및 reader/ 폴더)
          [System.IO.File]::WriteAllText("google-credentials.json", $env:GOOGLE_CREDS, [System.Text.Encoding]::UTF8)
          [System.IO.File]::WriteAllText("reader/google-credentials.json", $env:GOOGLE_CREDS, [System.Text.Encoding]::UTF8)

          $rootFile = Get-Item "google-credentials.json"
          $readerFile = Get-Item "reader/google-credentials.json"
          Write-Host "  - Root file created   : $($rootFile.Length) bytes ($($rootFile.FullName))"
          Write-Host "  - Reader file created : $($readerFile.Length) bytes ($($readerFile.FullName))"
          Write-Host "=========================================================="

      - name: Run Tests
        run: |
          pnpm build:shared
          pnpm test

      - name: Verify Build
        run: pnpm build:all

      # [2단계] 컴파일 결과(dist/) 내 google-credentials.json 포함 여부 검증
      - name: Validate Build Artifacts (dist/)
        shell: pwsh
        run: |
          Write-Host "=========================================================="
          Write-Host "🔍 [STEP 2] Inspecting reader/dist/ contents..."
          Write-Host "=========================================================="

          $distMainCred = "reader/dist/main/google-credentials.json"
          $distCred = "reader/dist/google-credentials.json"

          $foundMain = Test-Path $distMainCred
          $foundDist = Test-Path $distCred

          Write-Host "  - reader/dist/main/google-credentials.json : $(if ($foundMain) { '✅ Found (' + (Get-Item $distMainCred).Length + ' bytes)' } else { '❌ Missing' })"
          Write-Host "  - reader/dist/google-credentials.json      : $(if ($foundDist) { '✅ Found (' + (Get-Item $distCred).Length + ' bytes)' } else { '❌ Missing' })"

          if (-not $foundMain -or -not $foundDist) {
            Write-Error "❌ CRITICAL: google-credentials.json was NOT copied to reader/dist/ during build!"
            exit 1
          }
          Write-Host "=========================================================="

      # 버전이 최신이거나 동일 버전인 경우 exe 패키징 실행
      - name: Package Windows Executables
        if: steps.version_check.outputs.should_release == 'true'
        run: pnpm package:win:all

      # [3단계] 패키징된 app.asar 바이너리 내부 파일 트리 검증
      - name: Validate Packaged Binary (app.asar & exe)
        if: steps.version_check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          Write-Host "=========================================================="
          Write-Host "🔍 [STEP 3] Inspecting packaged app.asar and installer..."
          Write-Host "=========================================================="

          $asarPath = "reader/release/win-unpacked/resources/app.asar"
          if (-not (Test-Path $asarPath)) {
            Write-Error "❌ CRITICAL: $asarPath not found!"
            exit 1
          }

          Write-Host "📦 Inspecting $asarPath contents via asar CLI..."
          $asarList = npx --yes asar list $asarPath

          $matchedLines = $asarList | Where-Object { $_ -like "*google-credentials.json*" }
          Write-Host "🔍 Matching files in app.asar:"
          $matchedLines | ForEach-Object { Write-Host "   -> $_" }

          if (-not $matchedLines -or $matchedLines.Count -eq 0) {
            Write-Error "❌ CRITICAL: google-credentials.json is NOT inside app.asar! Failing release!"
            exit 1
          }

          Write-Host "✅ Verified: google-credentials.json is physically bundled in app.asar!"

          # 최종 생성된 Setup.exe 파일 확인
          $setupExe = Get-Item "reader/release/KFHI-QR-Reader-Setup-*.exe"
          $genExe = Get-Item "generator/release/KFHI-QR-Generator-Setup-*.exe"
          Write-Host "📦 Generated Installers:"
          Write-Host "   -> Reader: $($setupExe.Name) ($([Math]::Round($setupExe.Length / 1MB, 2)) MB)"
          Write-Host "   -> Generator: $($genExe.Name) ($([Math]::Round($genExe.Length / 1MB, 2)) MB)"
          Write-Host "=========================================================="

      # GitHub CLI를 통한 안정적인 Release 생성 및 순차적 대용량 exe 파일 업로드
      - name: Create GitHub Release & Upload Binaries
        if: steps.version_check.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version_check.outputs.tag_name }}
        run: |
          Write-Host "Creating or verifying GitHub Release for $env:TAG_NAME..."
          
          # Release 생성 시도 (이미 존재하는 경우 오류 무시하고 업로드로 진행)
          $createResult = gh release create $env:TAG_NAME --title "Release $env:TAG_NAME" --generate-notes --draft=false --prerelease=false 2>&1
          Write-Host "Release create response: $createResult"

          # EXE 파일 목록 확인
          $files = Get-ChildItem -Path "generator/release/*.exe", "reader/release/*.exe" -File
          Write-Host "Found $($files.Count) binary files to upload:"
          $files | ForEach-Object { Write-Host " - $($_.FullName)" }

          if ($files.Count -eq 0) {
            Write-Error "No .exe files found to upload in generator/release or reader/release!"
            exit 1
          }

          # 대용량 바이너리를 순차적으로 안정 업로드 (--clobber 로 덮어쓰기 허용)
          foreach ($file in $files) {
            Write-Host "Uploading $($file.Name)..."
            gh release upload $env:TAG_NAME "$($file.FullName)" --clobber
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to upload $($file.Name)"
              exit 1
            }
            Write-Host "Successfully uploaded $($file.Name)"
          }

